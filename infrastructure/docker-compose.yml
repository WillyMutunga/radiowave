version: '3.8'

services:
  # Web / PHP Application Server
  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: radiowave_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - DB_DRIVER=sqlite
      - ICECAST_HOST=icecast
      - ICECAST_PORT=8000
    volumes:
      - ../backend/data:/var/www/html/backend/data
      - ../public/uploads:/var/www/html/public/uploads
    depends_on:
      - icecast

  # Icecast Streaming Server
  icecast:
    image: plribeiro3000/icecast:latest
    container_name: radiowave_icecast
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=hackme_source
      - ICECAST_ADMIN_PASSWORD=radiowave_admin_pass_2026
      - ICECAST_PASSWORD=hackme
      - ICECAST_RELAY_PASSWORD=hackme_relay
    volumes:
      - ./icecast/icecast.xml:/etc/icecast.xml:ro

  # Redis for Caching and Telemetry
  redis:
    image: redis:7-alpine
    container_name: radiowave_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
